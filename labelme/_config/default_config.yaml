---
auto_save: true
display_label_popup: true
with_image_data: false
keep_prev: false
keep_prev_scale: false
keep_prev_brightness_contrast: false
# UI language as a locale code (e.g. ja_JP); null follows the system locale.
language: en_US
# Color theme: 'system' follows the OS appearance, or force 'light' / 'dark'.
color_theme: system
flags:
label_flags:
# class
labels:
  - 민간인
  - 군인
  - 민간차량
  - 소형전술차량
  - 전차
  - 자주포
  - 장갑차

# attributes
shape_attributes:
  - key: 시선방향
    label: 시선방향
    options:
      - 정면
      - 측면
      - 후면
      - 불분명

  - key: 무장여부
    label: 무장여부
    options:
      - true
      - false

  - key: 무기타입
    label: 무기타입
    options:
      - 소총
      - 대전차화기
      - 원격무장
      - 포/포탑
      - None

  - key: 무기방향
    label: 무기방향
    options:
      - 정면
      - 이외
file_search:
sort_labels: false
validate_label: exact
shape_color:
  mode: auto  # auto, uniform, by_label
  auto:
    shift: 0
  uniform:
    color: [0, 255, 0]
  by_label:
    colors:
    fallback: [0, 255, 0]
shape:
  # drawing
  line_color: [0, 255, 0, 128]
  fill_color: [0, 0, 0, 64]
  vertex_fill_color: [0, 255, 0, 255]
  # selecting / hovering
  select_line_color: [255, 255, 255, 255]
  select_fill_color: [0, 255, 0, 64]
  hvertex_fill_color: [255, 255, 255, 255]
  point_size: 6
  show_labels: true
mask_polygonization:
  detail: 80
ai:
  default: Sam2 (balanced)
  suppress_existing_shape_matches: false
# main
flag_dock:
  show: true
  closable: true
  movable: true
  floatable: true
label_dock:
  show: true
  closable: true
  movable: true
  floatable: true
shape_dock:
  show: true
  closable: true
  movable: true
  floatable: true
file_dock:
  show: true
  closable: true
  movable: true
  floatable: true
# label_dialog
show_label_text_field: false
label_completion: startswith
fit_to_content:
  column: true
  row: false
# canvas
epsilon: 10.0
canvas:
  fill_drawing: true
  # None: do nothing
  # close: close polygon
  double_click: close
  # max undo depth (number of edits kept on the backup stack)
  num_backups: 10
  # allow annotation points to extend beyond the image boundary
  allow_out_of_bounds_points: false
  # show crosshair
  crosshair:
    polygon: false
    rectangle: true
    oriented_rectangle: false
    circle: false
    line: false
    point: false
    linestrip: false
    ai_points_to_shape: false
    ai_box_to_shape: true
shortcuts:
  close: Ctrl+W
  open: Ctrl+O
  open_dir: Ctrl+U
  quit: Ctrl+Q
  save: Ctrl+S
  save_as: Ctrl+Shift+S
  save_to:
  delete_file: Ctrl+Delete
  open_next: [D, Ctrl+Shift+D]
  open_prev: [A, Ctrl+Shift+A]
  zoom_in: [Ctrl++, Ctrl+=]
  zoom_out: Ctrl+-
  zoom_to_original: Ctrl+0
  fit_window: Ctrl+F
  fit_width: Ctrl+Shift+F
  create_polygon: Ctrl+N
  create_rectangle: Ctrl+R
  create_oriented_rectangle:
  create_circle:
  create_line:
  create_point:
  create_linestrip:
  edit_shape: Ctrl+J
  delete_shape: Delete
  duplicate_shape: Ctrl+D
  copy_shape: Ctrl+C
  paste_shape: Ctrl+V
  undo: Ctrl+Z
  undo_last_point: Ctrl+Z
  edit_label: Ctrl+E
  toggle_keep_prev_mode: Ctrl+P
  remove_selected_point: [Meta+H, Backspace]
  show_all_shapes:
  hide_all_shapes:
  toggle_all_shapes: T
