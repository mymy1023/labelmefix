name: Build macOS App

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Build macOS App
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onefile \
            --windowed \
            --name LabelmeBBox \
            --collect-all labelme \
            --collect-all osam \
            launcher.py

      - name: Test macOS App Launch
        run: |
          APP_BIN="dist/LabelmeBBox.app/Contents/MacOS/LabelmeBBox"

          "$APP_BIN" > /tmp/labelme.log 2>&1 &
          PID=$!

          sleep 10

          if kill -0 $PID 2>/dev/null; then
            echo "LabelmeBBox.app started successfully."
            kill $PID
          else
            echo "LabelmeBBox.app failed to start."
            cat /tmp/labelme.log
            exit 1
          fi

      - name: Package macOS App as TAR
        run: |
          tar -czf LabelmeBBox-macOS.tar.gz \
            -C dist \
            LabelmeBBox.app

      - name: Upload macOS App
        uses: actions/upload-artifact@v4
        with:
          name: LabelmeBBox-macOS
          path: LabelmeBBox-macOS.tar.gz